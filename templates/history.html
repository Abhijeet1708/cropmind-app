{% extends "base.html" %}

{% block content %}
<div class="bg-primary-green text-white py-4 shadow-sm mb-5">
    <div class="container">
        <h2 class="fw-bold poppins-font mb-0"><i class="bi bi-clock-history me-2"></i>Prediction History</h2>
        <p class="mb-0 text-white-50">Review, search, and export your past predictions.</p>
    </div>
</div>

<div class="container mb-5">
    <!-- Controls -->
    <div class="row g-3 mb-4">
        <div class="col-md-4">
            <div class="input-group shadow-sm">
                <span class="input-group-text bg-white border-end-0"><i class="bi bi-search text-muted"></i></span>
                <input type="text" id="search-input" class="form-control border-start-0 ps-0" placeholder="Search crops...">
            </div>
        </div>
        <div class="col-md-3">
            <select id="filter-select" class="form-select shadow-sm">
                <option value="">All Crops</option>
                <!-- Populated dynamically -->
            </select>
        </div>
        <div class="col-md-3">
            <select id="sort-select" class="form-select shadow-sm">
                <option value="date-desc">Newest First</option>
                <option value="date-asc">Oldest First</option>
                <option value="conf-desc">Highest Confidence</option>
                <option value="conf-asc">Lowest Confidence</option>
            </select>
        </div>
        <div class="col-md-2 text-md-end">
            <div class="dropdown">
                <button class="btn btn-primary-green dropdown-toggle w-100 shadow-sm" type="button" data-bs-toggle="dropdown">
                    Actions
                </button>
                <ul class="dropdown-menu dropdown-menu-end shadow">
                    <li><button id="export-csv-btn" class="dropdown-item"><i class="bi bi-filetype-csv me-2 text-primary-green"></i>Export to CSV</button></li>
                    <li><hr class="dropdown-divider"></li>
                    <li><button id="clear-all-btn" class="dropdown-item text-danger"><i class="bi bi-trash me-2"></i>Clear History</button></li>
                </ul>
            </div>
        </div>
    </div>

    <!-- History List -->
    <div id="history-empty" class="text-center py-5 d-none bg-light rounded-4 border border-dashed">
        <div class="display-1 text-muted mb-3 opacity-25"><i class="bi bi-folder-x"></i></div>
        <h4 class="fw-bold text-muted poppins-font">No history found</h4>
        <p class="text-muted small">You haven't made any predictions yet or no results match your search.</p>
        <a href="{{ url_for('predict.predict') }}" class="btn btn-outline-primary-green mt-2">Make a Prediction</a>
    </div>

    <div class="accordion shadow-sm" id="history-accordion">
        <!-- Injected via JS -->
    </div>
</div>
{% endblock %}

{% block page_scripts %}
<script src="{{ url_for('static', filename='js/history.js') }}"></script>
{% endblock %}
