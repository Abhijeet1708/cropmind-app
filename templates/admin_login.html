{% extends "base.html" %}

{% block content %}
<div class="container py-5 d-flex justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="card border-0 shadow-lg rounded-4" style="max-width: 400px; width: 100%;">
        <div class="card-body p-5 text-center">
            <div class="display-3 text-primary-green mb-3"><i class="bi bi-shield-lock"></i></div>
            <h3 class="fw-bold poppins-font mb-4">Admin Access</h3>
            
            {% if error %}
            <div class="alert alert-danger small py-2">{{ error }}</div>
            {% endif %}
            
            <form method="POST" action="{{ url_for('admin.admin_index') }}">
                <div class="mb-4 text-start">
                    <label for="secret" class="form-label small fw-bold text-muted">Secret Key</label>
                    <input type="password" class="form-control form-control-lg bg-light border-0" id="secret" name="secret" required placeholder="Enter admin secret">
                    <div class="form-text small mt-2">Hint: Use 'cropmind_admin'</div>
                </div>
                <button type="submit" class="btn btn-primary-green w-100 py-3 fw-bold shadow-sm">Secure Login</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
